# Shared ruff config for the uv workspace packages (models, core, worker,
# reconciler, server), pulled in via `extend` from each package's
# pyproject.toml. NOT extended by alembic/ — that still uses the root
# pyproject.toml's minimal [tool.ruff] (target-version, line-length, format
# quote-style only) and ruff's default lint select, since alembic's
# autogenerated migrations don't pass this stricter rule set.
target-version = "py312"
line-length = 100

[format]
quote-style = "single"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "FA", "ANN", "DTZ", "PLC0415"]
ignore = ["ANN204", "ANN401"]

[lint.flake8-annotations]
suppress-none-returning = true

[lint.isort]
force-single-line = false
