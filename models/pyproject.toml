[project]
name = "hideandseek-models"
version = "0.1.0"
description = "SQLAlchemy models for HideAndSeek"
authors = [
    { name = "Dan Marchese", email = "dan@marchese.me" }
]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.46",
    "geoalchemy2>=0.18.1",
    "shapely>=2.1.2",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pyright>=1.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "FA", "ANN", "DTZ", "PLC0415"]
ignore = ["ANN204", "ANN401"]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["hideandseek_models"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
