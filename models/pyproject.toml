[project]
name = "hideandseek-models"
version = "0.1.0"
description = "SQLAlchemy models for HideAndSeek"
authors = [
    { name = "Dan Marchese", email = "dan@marchese.me" }
]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.46",
    "geoalchemy2>=0.18.1",
    "shapely>=2.1.2",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pyright>=1.1.0",
]

[tool.ruff]
extend = "../ruff-shared.toml"

[tool.ruff.lint.isort]
known-first-party = ["hideandseek_models"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
