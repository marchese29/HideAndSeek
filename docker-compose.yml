name: hideandseek

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hideandseek
      POSTGRES_USER: hideandseek
      POSTGRES_PASSWORD: hideandseek
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hideandseek -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 10
      # postgis init scripts briefly open a Unix socket before the TCP restart;
      # -h 127.0.0.1 + start_period avoid declaring healthy during that window.
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns,s3
      DEBUG: 0
    volumes:
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    working_dir: /app
    command: uv run alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://hideandseek:hideandseek@postgres:5432/hideandseek
    volumes:
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./models/src:/app/models/src
      - ./core/src:/app/core/src
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: uv run uvicorn hideandseek.main:app --host 0.0.0.0 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://hideandseek:hideandseek@postgres:5432/hideandseek
      CELERY_BROKER_URL: redis://redis:6379/0
      ENV: development
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      SNS_APNS_APP_ARN: arn:aws:sns:us-east-1:000000000000:app/APNS_SANDBOX/hideandseek-ios-dev
      SNS_FCM_APP_ARN: arn:aws:sns:us-east-1:000000000000:app/GCM/hideandseek-android-dev
      S3_BUCKET_NAME: hideandseek-photos-local
    volumes:
      - ./server/src:/app/server/src
      - ./worker/src:/app/worker/src
      - ./reconciler/src:/app/reconciler/src
      - ./models/src:/app/models/src
      - ./core/src:/app/core/src
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/healthz\")'"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: uv run celery -A hideandseek_worker.celery_app worker
    environment:
      DATABASE_URL: postgresql+psycopg://hideandseek:hideandseek@postgres:5432/hideandseek
      CELERY_BROKER_URL: redis://redis:6379/0
      ENV: development
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      SNS_APNS_APP_ARN: arn:aws:sns:us-east-1:000000000000:app/APNS_SANDBOX/hideandseek-ios-dev
      SNS_FCM_APP_ARN: arn:aws:sns:us-east-1:000000000000:app/GCM/hideandseek-android-dev
      S3_BUCKET_NAME: hideandseek-photos-local
    volumes:
      - ./server/src:/app/server/src
      - ./worker/src:/app/worker/src
      - ./reconciler/src:/app/reconciler/src
      - ./models/src:/app/models/src
      - ./core/src:/app/core/src
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  reconciler:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: uv run python -m hideandseek_reconciler
    environment:
      DATABASE_URL: postgresql+psycopg://hideandseek:hideandseek@postgres:5432/hideandseek
      CELERY_BROKER_URL: redis://redis:6379/0
      ENV: development
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET_NAME: hideandseek-photos-local
    volumes:
      - ./server/src:/app/server/src
      - ./worker/src:/app/worker/src
      - ./reconciler/src:/app/reconciler/src
      - ./models/src:/app/models/src
      - ./core/src:/app/core/src
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  pgdata:
