components:
  schemas:
    AskQuestionRequest:
      properties:
        slot_index:
          type: integer
          title: Slot Index
          description: 0-based index into the inventory for this question type.
        location:
          $ref: '#/components/schemas/Point'
          description: Current seeker position as a GeoJSON Point.
        custom_distance:
          anyOf:
          - type: number
          - type: 'null'
          title: Custom Distance
          description: Required for custom slots (distance=null).
      type: object
      required:
      - slot_index
      - location
      title: AskQuestionRequest
      description: Ask a question, identified by slot_index. The URL determines question_type.
    CreateGameRequest:
      properties:
        map_id:
          type: string
          format: uuid
          title: Map Id
          description: ID of the map to play on.
        name:
          type: string
          title: Name
          description: Display name for the host player.
        excluded_stop_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Excluded Stop Ids
          description: Stop IDs to exclude from play for this game.
        excluded_route_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Excluded Route Ids
          description: Route IDs to exclude from play for this game.
        device_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Token
          description: Native push token (APNs or FCM). Optional for game creation.
        device_token_provider:
          type: string
          title: Device Token Provider
          description: 'Push provider: "apns" (iOS) or "fcm" (Android).'
          default: apns
        hiding_time_min:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Hiding Time Min
          description: Override hiding phase duration. Defaults to map size.
        base_question_delay_min:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Base Question Delay Min
          description: Override auto-answer delay. Defaults to 5 minutes.
      type: object
      required:
      - map_id
      - name
      title: CreateGameRequest
      description: Create a new game on a map.
    EffectiveMapResponse:
      properties:
        name:
          type: string
          title: Name
        size:
          $ref: '#/components/schemas/MapSize'
        boundary:
          $ref: '#/components/schemas/Polygon'
          description: GeoJSON Polygon.
        districts:
          items: {}
          type: array
          title: Districts
        district_classes:
          items: {}
          type: array
          title: District Classes
        stops:
          items:
            $ref: '#/components/schemas/StopResponse'
          type: array
          title: Stops
        routes:
          items:
            $ref: '#/components/schemas/RouteResponse'
          type: array
          title: Routes
      type: object
      required:
      - name
      - size
      - boundary
      - districts
      - district_classes
      - stops
      - routes
      title: EffectiveMapResponse
      description: 'The game map with transit data and exclusions applied.


        Single source of truth for what the client should render.'
    ElectStationRequest:
      properties:
        station_id:
          type: string
          format: uuid
          title: Station Id
          description: ID of the stop to elect as hider station.
        location:
          $ref: '#/components/schemas/Point'
          description: Current hider position as a GeoJSON Point.
      type: object
      required:
      - station_id
      - location
      title: ElectStationRequest
      description: "Elect a hider station \u2014 lock in the hiding zone."
    EndgameExclusionEntryResponse:
      properties:
        question_id:
          type: string
          format: uuid
          title: Question Id
        sequence:
          type: integer
          title: Sequence
          description: 1-based chronological order within the game.
        exclusion:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/Point'
            - $ref: '#/components/schemas/MultiPoint'
            - $ref: '#/components/schemas/LineString'
            - $ref: '#/components/schemas/MultiLineString'
            - $ref: '#/components/schemas/Polygon'
            - $ref: '#/components/schemas/MultiPolygon'
            - $ref: '#/components/schemas/GeometryCollection'
            discriminator:
              propertyName: type
              mapping:
                GeometryCollection: '#/components/schemas/GeometryCollection'
                LineString: '#/components/schemas/LineString'
                MultiLineString: '#/components/schemas/MultiLineString'
                MultiPoint: '#/components/schemas/MultiPoint'
                MultiPolygon: '#/components/schemas/MultiPolygon'
                Point: '#/components/schemas/Point'
                Polygon: '#/components/schemas/Polygon'
          - type: 'null'
          title: Exclusion
          description: Exclusion zone intersected with the hiding zone circle.
        total_exclusion:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/Point'
            - $ref: '#/components/schemas/MultiPoint'
            - $ref: '#/components/schemas/LineString'
            - $ref: '#/components/schemas/MultiLineString'
            - $ref: '#/components/schemas/Polygon'
            - $ref: '#/components/schemas/MultiPolygon'
            - $ref: '#/components/schemas/GeometryCollection'
            discriminator:
              propertyName: type
              mapping:
                GeometryCollection: '#/components/schemas/GeometryCollection'
                LineString: '#/components/schemas/LineString'
                MultiLineString: '#/components/schemas/MultiLineString'
                MultiPoint: '#/components/schemas/MultiPoint'
                MultiPolygon: '#/components/schemas/MultiPolygon'
                Point: '#/components/schemas/Point'
                Polygon: '#/components/schemas/Polygon'
          - type: 'null'
          title: Total Exclusion
          description: Cumulative exclusion across endgame-scoped questions.
      type: object
      required:
      - question_id
      - sequence
      - exclusion
      - total_exclusion
      title: EndgameExclusionEntryResponse
      description: One question's exclusion intersected with the hiding zone.
