                LineString: '#/components/schemas/LineString'
                MultiLineString: '#/components/schemas/MultiLineString'
                MultiPoint: '#/components/schemas/MultiPoint'
                MultiPolygon: '#/components/schemas/MultiPolygon'
                Point: '#/components/schemas/Point'
                Polygon: '#/components/schemas/Polygon'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/Point'
            - $ref: '#/components/schemas/MultiPoint'
            - $ref: '#/components/schemas/LineString'
            - $ref: '#/components/schemas/MultiLineString'
            - $ref: '#/components/schemas/Polygon'
            - $ref: '#/components/schemas/MultiPolygon'
            - $ref: '#/components/schemas/GeometryCollection'
          - type: 'null'
          title: Total Exclusion
        answered_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Answered At
      required:
      - question_id
      - sequence
      - question_type
      - status
      - answer
      - slot_index
      - asked_by
      - exclusion
      - total_exclusion
      - answered_at
      title: SeekerQuestionAnsweredEvent
      type: object
    SeekerQuestionHistoryEntry:
      description: 'A resolved question from the seeker''s perspective.


        Includes answer-time delta fields plus ask-time metadata for reconnecting

        seekers. Supersedes the removed ``GET /questions`` list endpoint.

        No hider-privileged data (no hider_location, no hider feature resolution).'
      properties:
        question_id:
          format: uuid
          title: Question Id
          type: string
        sequence:
          description: 1-based chronological order within the game.
          title: Sequence
          type: integer
        question_type:
          $ref: '#/components/schemas/QuestionType'
        status:
          $ref: '#/components/schemas/QuestionStatus'
          description: 'Terminal status: answered, vetoed, or abandoned.'
        ask_count:
          description: Which attempt this was (1 = first ask).
          title: Ask Count
          type: integer
        asked_by:
          description: Seeker who asked.
          format: uuid
          title: Asked By
          type: string
        asked_at:
          description: When the question was asked.
          format: date-time
          title: Asked At
          type: string
        slot_index:
          description: Inventory slot used.
          title: Slot Index
          type: integer
        parameters:
          anyOf:
          - $ref: '#/components/schemas/RadarParamsResponse'
          - $ref: '#/components/schemas/ThermometerParamsResponse'
          - $ref: '#/components/schemas/FeatureParamsResponse'
          - $ref: '#/components/schemas/TentacleParamsResponse'
          description: Type-specific question parameters.
          title: Parameters
        answer:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: yes/no/closer/farther or null if vetoed/abandoned.
          title: Answer
        exclusion:
          anyOf:
          - discriminator:
              mapping:
                GeometryCollection: '#/components/schemas/GeometryCollection'
                LineString: '#/components/schemas/LineString'
                MultiLineString: '#/components/schemas/MultiLineString'
                MultiPoint: '#/components/schemas/MultiPoint'
                MultiPolygon: '#/components/schemas/MultiPolygon'
                Point: '#/components/schemas/Point'
                Polygon: '#/components/schemas/Polygon'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/Point'
            - $ref: '#/components/schemas/MultiPoint'
            - $ref: '#/components/schemas/LineString'
            - $ref: '#/components/schemas/MultiLineString'
            - $ref: '#/components/schemas/Polygon'
            - $ref: '#/components/schemas/MultiPolygon'
            - $ref: '#/components/schemas/GeometryCollection'
          - type: 'null'
          default: null
          description: This question's exclusion zone.
          title: Exclusion
        total_exclusion:
          anyOf:
          - discriminator:
              mapping:
                GeometryCollection: '#/components/schemas/GeometryCollection'
                LineString: '#/components/schemas/LineString'
                MultiLineString: '#/components/schemas/MultiLineString'
                MultiPoint: '#/components/schemas/MultiPoint'
                MultiPolygon: '#/components/schemas/MultiPolygon'
                Point: '#/components/schemas/Point'
                Polygon: '#/components/schemas/Polygon'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/Point'
            - $ref: '#/components/schemas/MultiPoint'
            - $ref: '#/components/schemas/LineString'
            - $ref: '#/components/schemas/MultiLineString'
            - $ref: '#/components/schemas/Polygon'
            - $ref: '#/components/schemas/MultiPolygon'
            - $ref: '#/components/schemas/GeometryCollection'
          - type: 'null'
          default: null
          description: Cumulative exclusion after this question.
          title: Total Exclusion
        answered_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          description: When the question was resolved.
          title: Answered At
      required:
      - question_id
      - sequence
      - question_type
      - status
      - ask_count
      - asked_by
      - asked_at
      - slot_index
      - parameters
      title: SeekerQuestionHistoryEntry
      type: object
    SessionResponse:
      properties:
        player:
          $ref: '#/components/schemas/PlayerResponse'
        game_status:
          $ref: '#/components/schemas/GameStatus'
      type: object
      required:
      - player
      - game_status
      title: SessionResponse
      description: "Session validation \u2014 confirms the caller is a valid player\
        \ in the game."
    SlotResponse:
      properties:
        slot_index:
          type: integer
          title: Slot Index
          description: Original template position (stable across the game).
        distance:
          anyOf:
          - type: number
          - type: 'null'
          title: Distance
          description: Preset distance or null for custom. Radar/thermometer only.
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
          description: Feature category. Matching/measuring only.
        feature_class:
          anyOf:
          - type: integer
          - type: 'null'
          title: Feature Class
          description: Feature class tier. Classed categories only.
        ask_count:
          type: integer
          title: Ask Count
          description: Number of times this slot has been used.
      type: object
      required:
      - slot_index
      - ask_count
      title: SlotResponse
      description: A slot in the question inventory.
    StationElectionEvent:
      description: "Station election status changed \u2014 hider channel only."
      properties:
        station_election_status:
          $ref: '#/components/schemas/StationElectionStatus'
        hider_station_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Hider Station Id
      required:
      - station_election_status
      - hider_station_id
      title: StationElectionEvent
      type: object
    StationElectionStatus:
      enum:
      - pending
      - elected
      - auto_assigned
      - ambiguous
      title: StationElectionStatus
      type: string
    StopResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        stable_id:
          type: string
          title: Stable Id
          description: Stable identifier from the transit dataset.
        name:
          type: string
          title: Name
        coordinates:
          $ref: '#/components/schemas/Point'
          description: GeoJSON Point.
      type: object
      required:
      - id
      - stable_id
      - name
      - coordinates
      title: StopResponse
      description: A transit stop on the effective game map.
    TentacleEventParams:
      description: "Tentacles question parameters \u2014 category, distance, and in-circle\
        \ POIs."
      properties:
        type:
          const: tentacles
          default: tentacles
          title: Type
          type: string
        category:
          description: POI category (e.g. museum, hospital).
          title: Category
          type: string
        distance:
          description: Tentacle distance in convention units.
          title: Distance
          type: number
        poi_ids:
          description: Stable IDs of POIs within the distance circle.
          items:
            type: string
          title: Poi Ids
          type: array
        poi_names:
          description: Human-readable names, matching poi_ids order.
          items:
            type: string
          title: Poi Names
          type: array
      required:
      - category
      - distance
      - poi_ids
      - poi_names
      title: TentacleEventParams
      type: object
    TentaclePOIPreviewResponse:
      properties:
        feature_id:
          type: string
          title: Feature Id
          description: Stable identifier of the POI.
        name:
          type: string
          title: Name
          description: Human-readable name.
        location:
          $ref: '#/components/schemas/Point'
          description: GeoJSON Point location of the POI.
      type: object
      required:
      - feature_id
      - name
      - location
      title: TentaclePOIPreviewResponse
      description: A POI in a tentacles question preview.
    TentacleParamsResponse:
      description: Parameters for a tentacles question.
      properties:
        type:
          const: tentacles
          default: tentacles
          title: Type
          type: string
        category:
          description: POI category.
          title: Category
          type: string
        poi_ids:
          description: Stable IDs of POIs within the distance circle.
          items:
            type: string
          title: Poi Ids
          type: array
        poi_names:
          description: Human-readable names, matching poi_ids order.
          items:
            type: string
          title: Poi Names
          type: array
        hit:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: True if hider was in range (populated at answer time).
          title: Hit
        hider_feature_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Stable ID of the nearest POI on hit (populated at answer time).
          title: Hider Feature Id
      required:
      - category
      - poi_ids
      - poi_names
      title: TentacleParamsResponse
      type: object
    ThermometerEventParams:
      description: Thermometer question parameters.
      properties:
        type:
