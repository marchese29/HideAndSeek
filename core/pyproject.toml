[project]
name = "hideandseek-core"
version = "0.1.0"
description = "Shared business logic for HideAndSeek"
authors = [
    { name = "Dan Marchese", email = "dan@marchese.me" }
]
requires-python = ">=3.12"
dependencies = [
    "hideandseek-models",
    "sqlalchemy>=2.0.46",
    "geoalchemy2>=0.18.1",
    "shapely>=2.1.2",
    "pyproj>=3.7.2",
    "geojson-pydantic>=2.1.0",
    "pydantic>=2.0",
    "psycopg[binary]>=3.3.2",
    "redis>=7.2.0",
    "structlog>=25.5.0",
    "boto3>=1.34",
    "alembic>=1.13",
]

[tool.uv.sources]
hideandseek-models = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pyright>=1.1.0",
    "boto3-stubs[sns,s3]>=1.34",
    "botocore-stubs>=1.34",
]

[tool.ruff]
extend = "../ruff-shared.toml"

[tool.ruff.lint.isort]
known-first-party = ["hideandseek_core", "hideandseek_models"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
