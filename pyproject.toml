[project]
name = "hideandseek-workspace"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["server", "models", "core", "worker", "reconciler"]

# Applies to Python files not covered by a package-local pyproject.toml —
# in practice, just alembic/. Each package (models, core, worker,
# reconciler, server) carries its own ruff config, and ruff prefers the
# nearest one on the walk up.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "single"
